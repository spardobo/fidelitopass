name: Work item
description: Scope an approved issue for either planned deliverable conversion or bounded issue-only work.
body:
  - type: markdown
    attributes:
      value: For planned product/roadmap deliverable increments, convert the same approved Backlog Project draft item to an issue. For bounded minor changes, hotfixes, small bugs or explicitly owner-approved exceptions, start with an approved issue without a Project item. New or expanded deliverables always use draft-first conversion. Use an outcome-oriented title with at most one primary requirement ID, for example `[REQ-BIZ-001] Authenticate a Business owner`. Use original IDs from `docs/requirements.md` for product work. For non-product documentation or maintenance work, omit the ID from the title and explain the scope; never cite REQ-QLT-001 as evidence of product completion merely because documentation closed.
  - type: input
    id: requirement-ids
    attributes:
      label: Requirement IDs
      description: List applicable IDs from docs/requirements.md for product work; for non-product documentation/maintenance write `None` and justify scope below. Do not copy full criteria.
      placeholder: REQ-BIZ-001 or None
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the route and observable outcome. For planned work, convert the approved draft in place (Project item ID differs from issue number), then apply status:approved and assign the moving actor on this issue before In Development. For issue-only work, record explicit owner approval, apply status:approved and assign the responsible actor on this issue before implementation; no Project fields or transitions apply. Issue assignees are the source of truth on either route; never independently assign the Project item. Stop if a required gate fails or remains uncertain.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and selected criteria
      description: State what is included and excluded, identify selected canonical criteria for product work, or justify why non-product work has no requirement ID. Explain why issue-only work is bounded rather than a new or expanded deliverable, if applicable. Do not imply every linked requirement is satisfied.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List upstream items, external access, and decisions, or write `None`.
    validations:
      required: true
  - type: textarea
    id: acceptance-evidence
    attributes:
      label: Acceptance evidence
      description: State acceptance examples, rejection paths, and verification evidence for this item. Link actual evidence in this issue and its PRs; closure alone does not prove whole-requirement acceptance.
    validations:
      required: true
  - type: textarea
    id: cross-cutting-requirements
    attributes:
      label: Cross-cutting requirements
      description: List applicable security, accessibility, performance, reliability, and maintainability requirement IDs, or write `None` with scope justification. Documentation completion alone does not verify REQ-QLT-001.
    validations:
      required: true
