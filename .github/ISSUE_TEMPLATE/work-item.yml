name: Work item
description: Structure the repository issue converted from the approved Backlog Project draft item.
body:
  - type: markdown
    attributes:
      value: This form supports issue content after conversion of the same approved Project draft item; do not start with a separate issue or add an existing one. Use an outcome-oriented title with at most one primary requirement ID, for example `[REQ-BIZ-001] Authenticate a Business owner`. Use original IDs from `docs/requirements.md` for product work. For non-product documentation or maintenance work, omit the ID from the title and explain the scope; never cite REQ-QLT-001 as evidence of product completion merely because documentation closed.
  - type: input
    id: requirement-ids
    attributes:
      label: Requirement IDs
      description: List applicable IDs from docs/requirements.md for product work; for non-product documentation/maintenance write `None` and justify scope below. Do not copy full criteria.
      placeholder: REQ-BIZ-001 or None
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the observable outcome. This issue comes from conversion of the approved Backlog Project draft item in place; its Project item ID differs from this issue number. After conversion, apply status:approved, assign the moving actor on this issue and verify both issue assignees and Project Assignees display that actor before setting Active. If conversion, label, assignment, status or readback fails, stop without claiming activation; never assign the Project item independently.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and selected criteria
      description: State what is included and excluded, identify selected canonical criteria for product work, or justify why non-product work has no requirement ID. Do not imply every linked requirement is satisfied.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List upstream items, external access, and decisions, or write `None`.
    validations:
      required: true
  - type: textarea
    id: acceptance-evidence
    attributes:
      label: Acceptance evidence
      description: State acceptance examples, rejection paths, and verification evidence for this item. Link actual evidence in this issue and its PRs; closure alone does not prove whole-requirement acceptance.
    validations:
      required: true
  - type: textarea
    id: cross-cutting-requirements
    attributes:
      label: Cross-cutting requirements
      description: List applicable security, accessibility, performance, reliability, and maintainability requirement IDs, or write `None` with scope justification. Documentation completion alone does not verify REQ-QLT-001.
    validations:
      required: true
