[global]
; Stay in the foreground so Supervisor can monitor the master process.
daemonize = no

; Send master-process failures to the container's standard error stream.
error_log = /proc/self/fd/2

[www]
; Keep same-container FastCGI traffic on a private filesystem socket.
listen = /run/php-fpm/php-fpm.sock

; Grant both Nginx and PHP-FPM access through their shared runtime identity.
listen.owner = www-data
listen.group = www-data

; Restrict socket access to its owner and group.
listen.mode = 0660

; Preserve deployment variables required by Laravel inside worker processes.
clear_env = no

; Forward worker output to the master process for centralized collection.
catch_workers_output = yes

; Keep log records machine-readable by omitting FPM decorations.
decorate_workers_output = no

; allocate PHP capacity on demand within the 0.1 CPU Sandbox budget
pm = ondemand

; share 256 MiB with Nginx, 64 MiB OPcache, and one 128 MiB request
pm.max_children = 1

; Reclaim the idle worker instead of retaining a warm pool.
pm.process_idle_timeout = 10s

; Recycle workers periodically to contain gradual memory growth.
pm.max_requests = 500

; Record requests that exceed the expected response-time envelope.
request_slowlog_timeout = 10s

; Emit slow-request traces through the container error stream.
slowlog = /proc/self/fd/2

; Free a worker when application execution exceeds the hard limit.
request_terminate_timeout = 60s
