[global]
; Stay in the foreground so Supervisor can monitor the master process.
daemonize = no

; Send master-process diagnostics to the container's standard error stream.
error_log = /proc/self/fd/2

; preserve the inherited Docker image's diagnostic line length
log_limit = 8192

; load only the owned rootless pool, not inherited Docker pool fragments
include = /usr/local/etc/php-fpm.d/www.conf
