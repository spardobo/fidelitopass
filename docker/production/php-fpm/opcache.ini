; Cache compiled PHP bytecode for production requests.
opcache.enable = 1

; Keep one-off CLI commands independent from the long-running FPM cache.
opcache.enable_cli = 0

; Avoid JIT overhead for this request-oriented Laravel workload.
opcache.jit = off

; Reserve a bounded shared-memory segment for compiled scripts.
opcache.memory_consumption = 64

; Deduplicate frequently repeated framework strings in shared memory.
opcache.interned_strings_buffer = 8

; Cover the framework and dependency graph without an oversized hash table.
opcache.max_accelerated_files = 10000

; Trust immutable container files and skip filesystem timestamp checks.
opcache.validate_timestamps = 0

; Cache resolved paths to reduce repeated filesystem lookups.
realpath_cache_size = 4096K

; Retain resolved paths because application files do not change in place.
realpath_cache_ttl = 600
