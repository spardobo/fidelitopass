[program:php-fpm]
; start PHP-FPM before Nginx and keep its master in the foreground
command=php-fpm --nodaemonize
priority=10
autorestart=true
startsecs=0

; allow active requests to finish before terminating the process group
stopsignal=QUIT
stopwaitsecs=70
stopasgroup=true
killasgroup=true

; forward child output to container streams without file rotation
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
